<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fotitos 💕</title>

    <style>
        body {
            background-image: url("kirby.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .volver {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 18px;
            background-color: rgba(255, 77, 109, 0.9);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            z-index: 10;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;

            padding: 80px 30px 30px; /* espacio por el botón */
            background-color: rgba(0,0,0,0.4);
        }

        .galeria img {
            width: 250px;
            height: auto;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <!-- BOTÓN VOLVER -->
    <a class="volver" href="Mensaje.html">🔙 Volver</a>

    <!-- GALERÍA -->
    <div class="galeria">
        <img src="foto1.jpg">
        <img src="caras.jpg">
        <img src="ojitos.jpg">
        <!-- agrega más fotos -->
    </div>

</body>
</html>
